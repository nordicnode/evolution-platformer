[workspace]
resolver = "2"
members = [
    "crates/sim",
    "crates/evo",
    "crates/render",
    "crates/train-cli",
    "crates/app",
]

# 0.2.0: the movement work. The sim gained sprint, wall jumps and edge-triggered
# jumping, the action set grew to nine and the sensors to 93 inputs, so the version
# trio moved together and every pre-0.2.0 champion is refused rather than replayed
# against physics it was not trained on (sim::SIM_VERSION is this value).
#
# 0.3.0: the jump ladder. `min_jump_hold` shrank from two decision blocks to one, so a
# jump released at the first opportunity is genuinely shorter than one held for two —
# before this the agent's first release decision was silently discarded and every jump
# was at least two blocks long. Fitness moved to v3 in the same step (the survival term
# removed, the death penalty resized); see `evo::fitness`. Both are changes a 0.2.0
# champion cannot survive being replayed against, so the version trio moves again.
#
# 0.4.0: checkpoints. The sim now counts the safe landing zones the body has *stood on*
# past a hazard or a hole (a new `EpisodeStats` field, and part of `state_hash`), and
# fitness v4 pays for them; see `evo::fitness::CHECKPOINT_BONUS`. Nothing about the
# physics moved, but the state a champion is replayed against did, so the trio moves.
#
# 0.5.0: the objective has no preferred direction. `progress_pixels` used to be "new
# rightmost x", which quietly defined the game as a left-to-right side-scroller and made
# a tower unwinnable (walking along the floor out-scored climbing, and the anti-camper
# rule killed a body that was steadily going up). It is now distance closed on the flag,
# the frame cap is set by the *longer* side of the level, and the goal sensor is a
# two-axis vector instead of a horizontal sign. All three are visible to an agent, so
# sensors v3, fitness v5 and sim 0.5.0 move together.
#
# 0.6.0: leftward is a first-class direction. The action table had no leftward sprint —
# the fast gear existed only on the rightward pair — so `shift` + left was a plain
# retreat, and the reachability oracle, which could not express the move either, called the
# *mirror of `l8-long-jump`* unbeatable. `RetreatSprint` and `RetreatSprintJump` are
# appended (indices 9 and 10, so no earlier index changes meaning) and the oracle now picks
# its action by direction as well as by speed. The observation's single directional gap
# probe went the same way: `gap_ahead` followed `sign(vx)` — "right" for a body at rest —
# and is now `gap_right` + `gap_left` (sensors v4). Nothing about the physics constants or
# the reward moved, but the action set and the observation did, so the trio moves and every
# earlier champion is refused.
# 0.7.0: bounded enemy vision, directional checkpoint arrivals, and brick/plank materials.
# The nearest-enemy sensor now clips to ENEMY_VIEW_DISTANCE (sensors v5), and checkpoint
# landings are credited symmetrically from whichever side the body left the ground
# (fitness v6).
#
# 0.8.0: the clock is part of the objective. A win is paid for the time it did not spend
# (`evo::fitness::SPEED_BONUS`, fitness v8), the archive gained a finish-band axis so a fast
# route and a slow one to the same zone are different niches, and `EpisodeStats` carries the
# level's own frame budget as the denominator of the ratio. Nothing about the physics moved,
# but the state an episode is scored against did, so the trio moves with it.
#
# 0.10.0: the spike's kill zone is the spike you can see. The sprite has always drawn its
# tips three of sixteen pixel rows below the tile's top, deliberately (a spike drawn to its
# ceiling reads as part of the wall above it, `tools/art/terrain.py::spikes`), while the
# hazard check tested the whole tile — so every spike carried an invisible kill band 0.1875
# tiles tall above the topmost drawn pixel. Measured on a hand-drawn level whose only route
# onto a platform passed over such a spike: 70% of a swept 6,480 scripted take-off/hold pairs
# died without the body ever touching a drawn spike pixel, and the one take-off position that
# survived had 0.025 tiles of clearance. The check is now box-versus-box against
# `physics::spike_lethal_box` — the lower 0.8125 tiles of the cell, the art's own extent — so
# clearing the drawing clears the hazard. A body can now stand in the spike's top
# 0.1875-tile band, which moves the pack's hazard levels and the oracle's spike verdicts with
# it: a physics change, so the trio moves and every earlier champion is refused rather than
# replayed against physics it was not trained on. See REVIEW.md §2.12.
#
# 0.9.0: a grounded turn is crisp. `Physics::turn_accel_scale` multiplies the horizontal
# acceleration when the press opposes the body's own velocity, but **only while grounded**: an
# airborne reversal stays exactly as slow as it was, because that is what keeps the pack's
# pits lethal (`crates/sim/tests/physics.rs::walking_into_a_pit_is_still_fatal` — a body that
# walks off a lip must not be able to press back onto the pit wall). A physics constant moved,
# so the trio moves and every earlier champion is refused rather than replayed against physics
# it was not trained on.
[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
sim = { path = "crates/sim" }
evo = { path = "crates/evo" }
render = { path = "crates/render" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_xoshiro = "0.8"
rayon = "1"
crossterm = "0.29"

# The desktop game shell: windowing, immediate-mode UI, and PNG decoding for the
# art atlas. Pinned to the 0.32 line for a fast, warm build.
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }

# Training is a tight numeric loop; keep release fat.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `cargo test --profile release` and benches share the training profile.
[profile.bench]
inherits = "release"
