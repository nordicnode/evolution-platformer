[workspace]
resolver = "2"
members = [
    "crates/sim",
    "crates/evo",
    "crates/render",
    "crates/train-cli",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
sim = { path = "crates/sim" }
evo = { path = "crates/evo" }
render = { path = "crates/render" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_xoshiro = "0.8"
rayon = "1"
crossterm = "0.29"

# The desktop game shell: windowing, immediate-mode UI, and PNG decoding for the
# art atlas. Pinned to the 0.32 line for a fast, warm build.
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }

# Training is a tight numeric loop; keep release fat.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `cargo test --profile release` and benches share the training profile.
[profile.bench]
inherits = "release"
